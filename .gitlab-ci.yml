# CI is the real enforcement behind the local hooks (docs/PLAN.md §2.3).
# Listed as a bonus in the case; set up from P0 because protected main
# relies on "Pipelines must succeed".
# No Anthropic key is ever defined here: tests run with the mock LLM.
# Images are pinned by digest (docs/PLAN.md §6 #16); the tag is kept for readability.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - policy
  - lint
  - test
  - security

variables:
  GO_IMAGE: golang:1.27-bookworm@sha256:972b4110ba0f47539a975c31e52c64765e1ff19f2d74469ae4a595c6676e80a5
  GOPATH: $CI_PROJECT_DIR/.go
  GOFLAGS: -mod=readonly

.go-cache:
  cache:
    key: go-$CI_COMMIT_REF_SLUG
    paths: [.go/pkg/mod/]

.mr-only:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Heavy jobs (make-test, govulncheck) run only for MRs into main and on main,
# to save CI minutes.

# ---------- policy ----------

branch-name:
  stage: policy
  image: $GO_IMAGE
  extends: .mr-only
  script:
    - scripts/hooks/check-branch-name.sh "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"

commit-messages:
  stage: policy
  image: $GO_IMAGE
  extends: .mr-only
  variables:
    GIT_DEPTH: 0
  script:
    # The MR title becomes the squash commit subject on main.
    - printf '%s\n' "$CI_MERGE_REQUEST_TITLE" > /tmp/mr-title
    - scripts/hooks/check-commit-msg.sh --subject-only /tmp/mr-title
    - |
      refs_found=0
      for sha in $(git rev-list "$CI_MERGE_REQUEST_DIFF_BASE_SHA..HEAD"); do
        git log -1 --format=%B "$sha" > /tmp/msg
        scripts/hooks/check-commit-msg.sh /tmp/msg || { echo "commit $sha"; exit 1; }
        if grep -Eq '^Refs: REQ-' /tmp/msg; then refs_found=1; fi
      done
      # feat/fix/test MRs must carry REQ refs into main: the squash template
      # (%{title} + %{all_commits}) copies them from the commits.
      case "$CI_MERGE_REQUEST_TITLE" in
        feat*|fix*|test*)
          if [ "$refs_found" -eq 0 ]; then echo "no commit in this MR has a 'Refs: REQ-' line"; exit 1; fi ;;
      esac

role-paths:
  stage: policy
  image: $GO_IMAGE
  extends: .mr-only
  variables:
    GIT_DEPTH: 0
  script:
    - scripts/hooks/check-role-paths.sh "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" "$CI_MERGE_REQUEST_DIFF_BASE_SHA"

forbidden-files:
  stage: policy
  image: $GO_IMAGE
  variables:
    GIT_DEPTH: 0
  script:
    - scripts/hooks/check-forbidden-files.sh --all
    # Files added and deleted again inside an MR still live in its refs.
    - |
      if [ -n "${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}" ]; then
        scripts/hooks/check-forbidden-files.sh --range "$CI_MERGE_REQUEST_DIFF_BASE_SHA"
      fi
    - git check-ignore -q .env
    - git check-ignore -q "Smart Campaign Composer Case.html"

no-api-key-in-ci:
  stage: policy
  image: $GO_IMAGE
  script:
    # The pattern is split so this file does not match itself.
    - if grep -n 'ANTHROPIC_API''_KEY' .gitlab-ci.yml; then echo "CI must not reference the API key"; exit 1; fi
    - if grep -nE 'sk-ant-[A-Za-z0-9_-]{10,}' .env.example; then echo ".env.example contains a key"; exit 1; fi

migrations:
  stage: policy
  image: $GO_IMAGE
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      exists: [migrations/**/*]
  variables:
    GIT_DEPTH: 0
  script:
    - git fetch -q origin "$CI_DEFAULT_BRANCH:refs/remotes/origin/$CI_DEFAULT_BRANCH"
    - scripts/hooks/check-migrations.sh --range "$CI_MERGE_REQUEST_DIFF_BASE_SHA"

# ---------- lint ----------

go-lint:
  stage: lint
  image: golangci/golangci-lint:v2.15.0@sha256:fbfcfd12a6f8d7f1b97b3362ca80fc2a244d46863148c73cb88e7793af96c481
  extends: .go-cache
  rules:
    - exists: [go.mod]
  script:
    - golangci-lint run ./...

sql-lint:
  stage: lint
  image:
    name: sqlfluff/sqlfluff:4.4.0@sha256:6a9083e55b1f4ea437636bc8ca7b55aaa0766a3e43a6d3e5b37614cf97e4e6ac
    entrypoint: [""]
  rules:
    - exists: [migrations/**/*.sql]
  script:
    - sqlfluff lint migrations/

# ---------- test ----------

go-unit:
  stage: test
  image: $GO_IMAGE
  extends: .go-cache
  rules:
    - exists: [go.mod]
  script:
    - go test -race -short -count=1 -shuffle=on ./...

make-test:
  stage: test
  image: docker:27@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce
  services:
    - docker:27-dind@sha256:aa3df78ecf320f5fafdce71c659f1629e96e9de0968305fe1de670e0ca9176ce
  rules:
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH
      exists: [compose.test.yml]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      exists: [compose.test.yml]
  before_script:
    - apk add --no-cache make bash
  script:
    # Only Docker + make are available here: proves REQ-DLV-02.
    - make test

# ---------- security ----------

gitleaks:
  stage: security
  image:
    name: zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    entrypoint: [""]
  variables:
    GIT_DEPTH: 0
  script:
    - gitleaks git --redact --no-banner -c .gitleaks.toml .

ai-sessions-scan:
  stage: security
  image: $GO_IMAGE
  rules:
    - exists: [ai-sessions/**/*]
  script:
    - scripts/hooks/check-ai-sessions.sh --all

govulncheck:
  stage: security
  image: $GO_IMAGE
  extends: .go-cache
  rules:
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH
      exists: [go.mod]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      exists: [go.mod]
  script:
    - go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
