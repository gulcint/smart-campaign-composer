# CI is the real enforcement behind the local hooks (docs/PLAN.md §2.3).
# Listed as a bonus in the case; set up from P0 because the main ruleset
# requires the `ci-ok` check.
# No Anthropic key is ever defined here: tests run with the mock LLM.
# Actions are pinned by commit SHA and images by digest (docs/PLAN.md §6 #16).
name: ci

on:
  pull_request:
    # labeled/unlabeled: re-run when the api-breaking-ok label changes.
    # edited: the PR title is the squash subject, so fixing it must re-run pr-policy.
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_IMAGE: golang:1.27-bookworm@sha256:972b4110ba0f47539a975c31e52c64765e1ff19f2d74469ae4a595c6676e80a5

jobs:
  # GitHub has no "exists:" rule; this job tells later jobs which parts of the repo exist yet,
  # and whether the change needs the heavy (build/test) jobs at all.
  detect:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.d.outputs.go }}
      migrations: ${{ steps.d.outputs.migrations }}
      compose_test: ${{ steps.d.outputs.compose_test }}
      web: ${{ steps.d.outputs.web }}
      heavy: ${{ steps.h.outputs.heavy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # the PR merge commit and its first parent (the base)
      # heavy=false only for a pull request whose every changed file is documentation:
      # ai-sessions/**, docs/** outside docs/contracts/, or *.md outside docs/contracts/ and web/
      # (contracts feed codegen and tests; `prettier --check .` in web/ also checks *.md).
      # Anything else, any doubt, and every non-PR event (push to main) -> heavy=true.
      # No workflow-level `paths:` filter: ci-ok must report on every PR (ruleset).
      - id: h
        env:
          EVENT: ${{ github.event_name }}
        run: |
          heavy=true
          if [ "$EVENT" = pull_request ] && git rev-parse -q --verify HEAD^2 >/dev/null; then
            # --no-renames: a file moved out of code into docs/ still lists its old path.
            heavy=false; n=0
            while IFS= read -r -d '' f; do
              n=$((n + 1))
              case "$f" in
                docs/contracts/*|web/*) heavy=true ;;
                ai-sessions/*|docs/*|*.md) ;;
                *) heavy=true ;;
              esac
            done < <(git -c core.quotePath=false diff --no-renames --name-only -z HEAD^1 HEAD)
            if [ "$n" -eq 0 ]; then heavy=true; fi
            echo "$n changed file(s)"
          fi
          echo "heavy=$heavy"
          echo "heavy=$heavy" >> "$GITHUB_OUTPUT"
      - id: d
        run: |
          {
            echo "go=$([ -f go.mod ] && echo true || echo false)"
            echo "migrations=$([ -d migrations ] && echo true || echo false)"
            echo "compose_test=$([ -f compose.test.yml ] && echo true || echo false)"
            echo "web=$([ -f web/package.json ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

  # ---------- policy ----------

  pr-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      # Passed through env, never interpolated into the script: PR fields are untrusted input.
      PR_TITLE: ${{ github.event.pull_request.title }}
      HEAD_REF: ${{ github.head_ref }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: branch name
        run: scripts/hooks/check-branch-name.sh "$HEAD_REF"
      - name: PR title and commit messages
        run: |
          # The PR title becomes the squash commit subject on main.
          printf '%s\n' "$PR_TITLE" > "$RUNNER_TEMP/title"
          scripts/hooks/check-commit-msg.sh --subject-only "$RUNNER_TEMP/title"
          base=$(git merge-base "$BASE_SHA" HEAD)
          refs_found=0
          for sha in $(git rev-list "$base..HEAD"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/msg"
            scripts/hooks/check-commit-msg.sh "$RUNNER_TEMP/msg" || { echo "commit $sha"; exit 1; }
            if grep -Eq '^Refs: REQ-' "$RUNNER_TEMP/msg"; then refs_found=1; fi
          done
          # feat/fix/test PRs must carry REQ refs into main: the squash message
          # (PR title + commit messages) copies them from the commits.
          case "$PR_TITLE" in
            feat*|fix*|test*)
              if [ "$refs_found" -eq 0 ]; then echo "no commit in this PR has a 'Refs: REQ-' line"; exit 1; fi ;;
          esac
      - name: role paths
        run: scripts/hooks/check-role-paths.sh "$HEAD_REF" "$(git merge-base "$BASE_SHA" HEAD)"
      - name: forbidden files in any commit of the PR
        run: scripts/hooks/check-forbidden-files.sh --range "$(git merge-base "$BASE_SHA" HEAD)"
      - name: migrations
        run: |
          if [ -d migrations ]; then
            scripts/hooks/check-migrations.sh --range "$(git merge-base "$BASE_SHA" HEAD)"
          fi

  repo-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: forbidden files
        run: |
          scripts/hooks/check-forbidden-files.sh --all
          git check-ignore -q .env
          git check-ignore -q "Smart Campaign Composer Case.html"
      - name: no API key in CI or .env.example
        run: |
          # The pattern is split so this file does not match itself.
          if grep -rn 'ANTHROPIC_API''_KEY' .github/; then echo "CI must not reference the API key"; exit 1; fi
          if grep -nE 'sk-ant-[A-Za-z0-9_-]{10,}' .env.example; then echo ".env.example contains a key"; exit 1; fi

  # ---------- lint ----------

  go-lint:
    needs: detect
    if: needs.detect.outputs.heavy == 'true' && needs.detect.outputs.go == 'true'
    runs-on: ubuntu-latest
    container: golangci/golangci-lint:v2.15.0@sha256:fbfcfd12a6f8d7f1b97b3362ca80fc2a244d46863148c73cb88e7793af96c481
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: golangci-lint run ./...

  # API <-> doc drift guard (contracts README §11), plus the embedded LLM tool schemas. api-routes
  # and the strict E2E validation run inside `make test` (make-test job).
  api-contract:
    runs-on: ubuntu-latest
    env:
      # A boolean derived from PR labels, passed through env (never interpolated into the script).
      API_BREAKING_OK: ${{ contains(github.event.pull_request.labels.*.name, 'api-breaking-ok') }}
      # Base branch of the PR (e.g. slice/p3-audience); empty on push. Used via env only.
      PR_BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history and all branches, so origin/<base> exists
      - name: choose the api-breaking base
        run: |
          # A PR is compared with its own base branch; a push to main with origin/main (script default).
          if [ -n "$PR_BASE_REF" ]; then
            git fetch --no-tags origin "+refs/heads/$PR_BASE_REF:refs/remotes/origin/$PR_BASE_REF"
            echo "API_BASE=origin/$PR_BASE_REF" >> "$GITHUB_ENV"
          fi
      - name: api-lint (redocly, pinned image, errors and warnings fail)
        run: make api-lint
      - name: check-contract-copies (embedded spec == docs/contracts)
        run: make check-contract-copies
      - name: check-tool-schemas (embedded LLM tool schemas == docs/contracts)
        run: make check-tool-schemas
      - name: api-breaking (oasdiff vs the PR base, origin/main on push; label api-breaking-ok lets intentional changes through)
        run: |
          if [ "$API_BREAKING_OK" = "true" ]; then
            make api-breaking || echo "::warning::breaking API changes accepted by the api-breaking-ok label; justify them in the PR and DECISIONS.md"
          else
            make api-breaking
          fi

  # Web UI: ESLint (vue/no-v-html: error) + Prettier, vue-tsc, Vitest, production build.
  web:
    needs: detect
    if: needs.detect.outputs.heavy == 'true' && needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    container: node:24-bookworm-slim@sha256:55fb5f5a527ea2c5c4a95f963e48ef90aa38c7b346054fdc8ee9957a2b55d205
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci --no-audit --no-fund
      # contracts README §11 `api-types-check` (same as `make api-types-check`; the image has no make).
      # The full checkout provides ../docs/contracts, and the job has no path filter, so spec-only
      # PRs run it too.
      - name: API types match docs/contracts/openapi.yaml
        run: |
          node scripts/api-types.mjs "$RUNNER_TEMP/schema.gen.ts"
          diff -u src/api/schema.gen.ts "$RUNNER_TEMP/schema.gen.ts" \
            || { echo "web/src/api/schema.gen.ts is stale: run 'make api-types' and commit it"; exit 1; }
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # docs/PLAN.md §6 #4: the key never reaches the bundle (pattern split so this file does not match).
      - name: no API key material in the bundle
        run: |
          if grep -rnE 'sk-''ant-|ANTHROPIC''_' dist; then echo "secret-looking string in web/dist"; exit 1; fi
      # docs/PLAN.md §6 #16
      - run: npm audit --audit-level=high

  sql-lint:
    needs: detect
    if: needs.detect.outputs.heavy == 'true' && needs.detect.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: >
          docker run --rm -v "$PWD:/src" -w /src
          sqlfluff/sqlfluff:4.4.0@sha256:6a9083e55b1f4ea437636bc8ca7b55aaa0766a3e43a6d3e5b37614cf97e4e6ac
          lint migrations/

  # up -> down -> up on a throwaway Postgres must leave an identical schema (docs/PLAN.md §2.2).
  db-roundtrip:
    needs: detect
    if: needs.detect.outputs.heavy == 'true' && needs.detect.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make db-roundtrip

  # ---------- test ----------

  hook-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make test-hooks

  # Unit + integration + E2E: scripts/test-container.sh runs `go test -race ./...` without
  # -short, a superset of a separate unit-test job.
  make-test:
    needs: detect
    if: needs.detect.outputs.heavy == 'true' && needs.detect.outputs.compose_test == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The runner provides Docker + make only for this purpose: proves REQ-DLV-02.
      - run: make test

  # ---------- security ----------

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: >
          docker run --rm -v "$PWD:/repo" -w /repo
          zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --redact --no-banner -c .gitleaks.toml .

  ai-sessions-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/hooks/check-ai-sessions.sh --all

  govulncheck:
    needs: detect
    if: needs.detect.outputs.heavy == 'true' && needs.detect.outputs.go == 'true'
    runs-on: ubuntu-latest
    container: golang:1.27-bookworm@sha256:972b4110ba0f47539a975c31e52c64765e1ff19f2d74469ae4a595c6676e80a5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  # ---------- gate ----------

  # The only required status check in the main ruleset. Skipped jobs (parts of
  # the repo that do not exist yet, or heavy jobs on a docs-only PR) pass; failed
  # or cancelled jobs do not.
  ci-ok:
    if: always()
    needs: [detect, pr-policy, repo-policy, go-lint, api-contract, web, sql-lint, db-roundtrip, hook-tests, make-test, gitleaks, ai-sessions-scan, govulncheck]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done
