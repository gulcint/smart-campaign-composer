# `docker compose up` brings up the whole system without an API key (REQ-DLV-01):
#   db -> migrate (scc_migrator) -> seed (scc_app) -> api, worker (scc_app) -> web, plus mockprovider
# With no ANTHROPIC_API_KEY, LLM_PROVIDER=auto selects the mock LLM (REQ-AI-03).
# Host ports are published on 127.0.0.1 only: the API (API_PORT, default 8080) and the web UI
# (WEB_PORT, default 8081; it proxies /api to the API, so the browser needs one origin).
# Postgres, the mock provider and the worker stay internal.
#
# Passwords below are local-demo values for a database that is never exposed.

name: scc

x-app: &app
  image: scc-app:local
  build:
    context: .
    target: runtime

x-db-env: &db-env
  DATABASE_URL: postgres://scc_app:scc_app_dev@db:5432/scc?sslmode=disable

services:
  db:
    image: postgres:16-bookworm@sha256:d81f7b51697014367236d07ec58b54153fc28f828b72bf247fe5c7487520bcb0
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev
      POSTGRES_DB: postgres
      SCC_MIGRATOR_PASSWORD: scc_migrator_dev
      SCC_APP_PASSWORD: scc_app_dev
      SCC_DATABASES: scc
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d scc"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    <<: *app
    command: ["migrate", "up"]
    environment:
      MIGRATE_DATABASE_URL: postgres://scc_migrator:scc_migrator_dev@db:5432/scc?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  seed:
    <<: *app
    # ref-time=now keeps "last 30 days" meaningful on a fresh volume. --if-empty makes restarts
    # non-destructive: once a dataset is loaded the seed exits 0 and campaigns are kept.
    # To re-seed relative to today (deletes campaigns and deliveries), run explicitly:
    #   docker compose run --rm seed seed --ref-time=now --reset --manifest=/tmp/manifest.json
    command: ["seed", "--seed=42", "--users=5000", "--ref-time=now", "--if-empty", "--manifest=/tmp/manifest.json"]
    environment:
      <<: *db-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    <<: *app
    command: ["api"]
    # The key is read at run time only (REQ-AI-05); the file is optional so that
    # `docker compose up` works without it.
    env_file:
      - path: .env
        required: false
    environment:
      <<: *db-env
      HTTP_ADDR: ":8080"
      MOCK_LLM_CHUNK_DELAY: 40ms
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      seed:
        condition: service_completed_successfully
    restart: unless-stopped

  mockprovider:
    <<: *app
    command: ["mockprovider"]
    environment:
      MOCK_PROVIDER_ADDR: ":8090"
    restart: unless-stopped

  # One dispatcher per channel; deliveries go only to the mock provider (REQ-SND-05).
  # /healthz, /readyz and /metrics on :8081 stay on the internal network.
  worker:
    <<: *app
    command: ["worker"]
    # Requests already started finish (PROVIDER_TIMEOUT 10s) and are recorded before exit.
    stop_grace_period: 20s
    environment:
      <<: *db-env
      WORKER_HTTP_ADDR: ":8081"
      PROVIDER_BASE_URL: http://mockprovider:8090
    depends_on:
      seed:
        condition: service_completed_successfully
      mockprovider:
        condition: service_started
    restart: unless-stopped

  web:
    image: scc-web:local
    build:
      context: ./web
      target: runtime
    ports:
      - "127.0.0.1:${WEB_PORT:-8081}:8080"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
